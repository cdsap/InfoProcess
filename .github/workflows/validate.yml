name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check / ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # check includes checkKotlinAbi and verifyJavaTargetMetadata for shared library modules.
      - name: Run checks, ABI validation and plugin validation
        run: ./gradlew check :plugin:validatePlugins :build-logic:check

  configuration-cache:
    name: Configuration cache reuse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Store configuration cache
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin:test --configuration-cache 2>&1 | tee "$RUNNER_TEMP/info-process-cc-first.log"
          grep -q "Configuration cache entry stored" "$RUNNER_TEMP/info-process-cc-first.log"

      - name: Reuse configuration cache
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin:test --configuration-cache 2>&1 | tee "$RUNNER_TEMP/info-process-cc-second.log"
          grep -q "Configuration cache entry reused" "$RUNNER_TEMP/info-process-cc-second.log"

